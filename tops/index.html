<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

    color: #1b2430;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
                 "Noto Sans KR", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; line-height: 1.5; overflow-wrap: anywhere;
  }
  .lock-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 26px 18px calc(26px + env(safe-area-inset-bottom));
  }
  .lock-card {
    width: 100%; max-width: 360px; margin: 0; background: #fff; border-radius: 18px;
    padding: 26px 22px 20px; box-shadow: 0 18px 44px rgba(4, 20, 38, .34);
  }
  .lock-ic {
    width: 48px; height: 48px; margin: 0 auto 14px; border-radius: 15px;
    background: #e8f0f8; display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .lock-card h1 { margin: 0 0 6px; font-size: 17px; letter-spacing: -.02em; color: #0f2c4a; text-align: center; }
  .lock-card .sub { margin: 0 0 20px; font-size: 12.5px; color: #74859a; text-align: center; line-height: 1.5; }
  .pin-row { display: flex; gap: 8px; }
  #pin {
    flex: 1; min-width: 0; height: 54px; padding: 0 0 0 .4em;
    border: 1.5px solid #d6dfe9; border-radius: 12px; background: #fafcfe;
    font-size: 23px; font-weight: 700; letter-spacing: .4em; text-align: center;
    color: #0f2c4a; font-variant-numeric: tabular-nums; outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  #pin:focus { border-color: #17618f; background: #fff; box-shadow: 0 0 0 3px rgba(23, 97, 143, .14); }
  #pin.bad { border-color: #d9716c; background: #fff7f7; }
  #go {
    height: 54px; padding: 0 18px; border: 0; border-radius: 12px; background: #0a2b52;
    color: #fff; font-size: 14px; font-weight: 700; letter-spacing: -.01em; cursor: pointer;
  }
  #go:active { background: #12456f; }
  #go:disabled { opacity: .55; }
  #msg { margin: 12px 0 0; min-height: 18px; font-size: 12.5px; line-height: 1.5; text-align: center; color: #74859a; }
  #msg.bad { color: #c0392b; }
  .foot-note { margin: 14px 0 0; font-size: 11px; color: #9aa8b8; text-align: center; }
  #lockBtn {
    position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px; z-index: 99;
    border: 1px solid rgba(255, 255, 255, .4); background: rgba(10, 43, 82, .84); color: #fff;
    font-size: 11.5px; font-weight: 600; letter-spacing: -.01em;
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  [hidden] { display: none !important; }

  var LS_KEY = "tops.table.v1";
  var lockView = document.getElementById("lockView"),
      appView = document.getElementById("app"),
      lockBtn = document.getElementById("lockBtn"),
      form = document.getElementById("lockForm"),
      pin = document.getElementById("pin"),
      go = document.getElementById("go"),
      msg = document.getElementById("msg");
  var styleEl = null, busy = false;

  function b64ToBytes(s) {
    var bin = atob(s), out = new Uint8Array(bin.length), i;
    for (i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function setMsg(text) { msg.textContent = text || ""; msg.classList.remove("bad"); }
  function setError(text) { msg.textContent = text || ""; msg.classList.add("bad"); }
  // 예전에 저장된 비밀번호가 남아 있으면 지운다(열 때마다 다시 입력).
  function clearStore() { try { localStorage.removeItem(LS_KEY); } catch (e) {} }

  async function decrypt(pass) {
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(pass), { name: "PBKDF2" }, false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
      baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(PAYLOAD.iv), tagLength: 128 }, key, b64ToBytes(PAYLOAD.ct));
    return JSON.parse(new TextDecoder("utf-8").decode(plain));
  }

  function showApp(data) {
    if (!styleEl) {
      styleEl = document.createElement("style");
      styleEl.textContent = data.css;
      document.head.appendChild(styleEl);
    }
    appView.innerHTML = data.body;
    if (data.title) { document.title = data.title; }
    appView.hidden = false;
    lockView.hidden = true;
    lockBtn.hidden = false;
    window.scrollTo(0, 0);
  }

  function relock() {
    if (styleEl && styleEl.parentNode) { styleEl.parentNode.removeChild(styleEl); }
    styleEl = null;
    appView.innerHTML = "";
    appView.hidden = true;
    lockView.hidden = false;
    lockBtn.hidden = true;
    document.title = "보고서";
    pin.value = "";
    pin.classList.remove("bad");
    setMsg("");
    clearStore();
    setTimeout(function () { pin.focus(); }, 60);
  }

  async function open(pass) {
    if (busy) { return; }
    busy = true;
    go.disabled = true;
    setMsg("여는 중…");
    try {
      var data = await decrypt(pass);
      setMsg("");
      showApp(data);
    } catch (e) {
      pin.value = "";
      pin.classList.add("bad");
      setError("비밀번호가 맞지 않습니다");
      setTimeout(function () { pin.focus(); }, 50);
    } finally {
      busy = false;
      go.disabled = false;
    }
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var v = (pin.value || "").replace(/[^0-9]/g, "");
    if (v.length !== 4) { setError("숫자 4자리를 입력해 주세요"); pin.focus(); return; }
    open(v);
  });

  pin.addEventListener("input", function () {
    var v = pin.value.replace(/[^0-9]/g, "").slice(0, 4);
    if (pin.value !== v) { pin.value = v; }
    pin.classList.remove("bad");
    if (msg.textContent) { setMsg(""); }
  });

  lockBtn.addEventListener("click", relock);

  if (!(window.crypto && window.crypto.subtle)) {
    setError("이 브라우저에서는 열 수 없습니다. 최신 Chrome·Safari로 열어 주세요.");
    go.disabled = true;
    return;
  }

  // 저장된 비밀번호를 불러와 자동으로 여는 동작은 없다. 예전 값만 지운다.
  clearStore();
  setTimeout(function () { pin.focus(); }, 60);
})();
