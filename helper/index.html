<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(120% 90% at 50% 0%, #22406b 0%, #16294a 42%, #14213d 100%);
    color: #1b2430;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
                 "Noto Sans KR", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; line-height: 1.5; overflow-wrap: anywhere;
  }
  .lock-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 26px 18px calc(26px + env(safe-area-inset-bottom));
  }
  .lock-card {
    width: 100%; max-width: 360px; margin: 0; background: #fff; border-radius: 20px;
    padding: 26px 22px 20px; box-shadow: 0 22px 54px rgba(3, 12, 28, .45);
  }
  .lock-ic {
    width: 62px; height: 62px; margin: 0 auto 14px; border-radius: 17px;
    background: #14213d; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(20, 33, 61, .28);
  }
  .lock-ic svg { width: 34px; height: 34px; display: block; }
  .lock-card h1 { margin: 0 0 6px; font-size: 17px; letter-spacing: -.02em; color: #10233f; text-align: center; }
  .lock-card .sub { margin: 0 0 20px; font-size: 12.5px; color: #74859a; text-align: center; line-height: 1.55; }
  .pin-row { display: flex; gap: 8px; }
  #pin {
    flex: 1; min-width: 0; height: 54px; padding: 0 0 0 .4em;
    border: 1.5px solid #d6dfe9; border-radius: 13px; background: #fafcfe;
    font-size: 23px; font-weight: 700; letter-spacing: .4em; text-align: center;
    color: #10233f; font-variant-numeric: tabular-nums; outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  #pin:focus { border-color: #2f5f9e; background: #fff; box-shadow: 0 0 0 3px rgba(47, 95, 158, .16); }
  #pin.bad { border-color: #d9716c; background: #fff7f7; }
  #go {
    height: 54px; padding: 0 18px; border: 0; border-radius: 13px; background: #14213d;
    color: #fff; font-size: 15px; font-weight: 700; letter-spacing: .01em;
    cursor: pointer; transition: transform .12s, background .15s;
  }
  #go:active { transform: scale(.97); }
  #go[disabled] { opacity: .55; }
  #msg { min-height: 18px; margin: 12px 0 0; font-size: 12.5px; color: #74859a; text-align: center; }
  #msg.bad { color: #c0392b; }
  .lock-foot { margin: 16px 0 0; font-size: 11.5px; color: #9aa7b6; text-align: center; line-height: 1.6; }
  @media (prefers-color-scheme: dark) {
    .lock-card { background: #1a2233; box-shadow: 0 22px 54px rgba(0, 0, 0, .5); }
    .lock-card h1 { color: #eef1f7; }
    .lock-card .sub { color: #93a0b4; }
    #pin { background: #232c3f; border-color: #33405a; color: #eef1f7; }
    #pin:focus { background: #263043; box-shadow: 0 0 0 3px rgba(141, 184, 245, .18); }
    #go { background: #2b4a7a; }
    .lock-foot { color: #78869c; }
  }
</style>

<div class="lock-wrap">
  <form class="lock-card" id="lockForm" autocomplete="off">
    <div class="lock-ic" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10.5" width="16" height="9.5" rx="2.4"></rect>
        <path d="M8.2 10.5V8.4a3.8 3.8 0 0 1 7.6 0v2.1"></path>
        <circle cx="12" cy="15.2" r="1.15" fill="#ffffff" stroke="none"></circle>
      </svg>
    </div>
    <h1>영업 도우미</h1>
    <p class="sub">비밀번호 4자리를 입력해 주세요.<br>입력한 번호는 저장되지 않습니다.</p>
    <div class="pin-row">
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*"
             maxlength="4" autocomplete="off" autocapitalize="off"
             spellcheck="false" aria-label="비밀번호 4자리" placeholder="">
      <button id="go" type="submit">열기</button>
    </div>
    <p id="msg" role="status" aria-live="polite"></p>
    <p class="lock-foot">이 페이지는 김정석 님 전용입니다.</p>
  </form>
</div>

  var form = document.getElementById("lockForm"),
      pin = document.getElementById("pin"),
      go = document.getElementById("go"),
      msg = document.getElementById("msg");

  function setMsg(text, bad) {
    msg.textContent = text || "";
    msg.classList.toggle("bad", !!bad);
  }

  function b64ToBytes(s) {
    var bin = atob(s), out = new Uint8Array(bin.length), i;
    for (i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function decrypt(pass) {
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(pass), { name: "PBKDF2" }, false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(PAYLOAD.salt),
         iterations: PAYLOAD.iter, hash: "SHA-256" },
      baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(PAYLOAD.iv), tagLength: 128 },
      key, b64ToBytes(PAYLOAD.ct));
    return new TextDecoder("utf-8").decode(plain);
  }

  // 복호화한 원본 HTML 전체를 그대로 문서로 쓴다.
  // 원본에 들어 있던 스타일과 스크립트가 모두 그대로 실행된다.
  function render(html) {
    document.open();
    document.write(html);
    document.close();
  }

  var busy = false;
  async function open(pass) {
    if (busy) return;
    busy = true;
    go.disabled = true;
    setMsg("여는 중…", false);
    try {
      var html = await decrypt(pass);
      render(html);
    } catch (e) {
      pin.value = "";
      pin.classList.add("bad");
      setMsg("비밀번호가 맞지 않습니다", true);
      setTimeout(function () { pin.focus(); }, 50);
    } finally {
      busy = false;
      go.disabled = false;
    }
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var v = (pin.value || "").replace(/[^0-9]/g, "");
    if (v.length !== 4) { setMsg("숫자 4자리를 입력해 주세요", true); pin.focus(); return; }
    open(v);
  });

  pin.addEventListener("input", function () {
    var v = pin.value.replace(/[^0-9]/g, "").slice(0, 4);
    if (pin.value !== v) pin.value = v;
    pin.classList.remove("bad");
    if (msg.textContent) setMsg("", false);
  });

  if (!(window.crypto && window.crypto.subtle && window.TextDecoder)) {
    setMsg("이 브라우저에서는 열 수 없습니다. 최신 Chrome·Safari로 열어 주세요.", true);
    go.disabled = true;
    pin.disabled = true;
    return;
  }

  // 비밀번호를 저장하거나 불러와 자동으로 여는 동작은 없다.
  try { localStorage.removeItem("sales.helper.v1"); } catch (e) {}
  setTimeout(function () { pin.focus(); }, 60);
})();
</script>
