<style>
  :root{
    --navy:#14233C;
    --hyundai:#002C5F;
    --hyundai-light:#0B3C78;
    --gold:#B89D5A;
    --gold-light:#CBB47C;
    --bg:#F3F5F8;
    --line:#E4E8EE;
    --line-soft:#EDF0F4;
    --text:#14233C;
    --text-sub:#5E6878;
    --text-mute:#8A93A0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;

  }
  .wrap{
    max-width:440px;
    margin:0 auto;
    padding:22px 18px 34px;
  }

  /* ───────── 상단 명함 ───────── */
  .hero{
    position:relative;
    background:
      radial-gradient(120% 90% at 50% 0%, #12457F 0%, rgba(18,69,127,0) 62%),
      linear-gradient(165deg,#0B3C78 0%, #002C5F 58%, #00254F 100%);
    border-radius:18px;
    padding:14px 14px 20px;
    overflow:hidden;
    box-shadow:0 14px 30px -14px rgba(0,44,95,.55);
  }
  .hero::before{
    content:"";
    position:absolute;
    top:-70px; right:-80px;
    width:230px; height:230px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:50%;
    pointer-events:none;
  }
  .hero::after{
    content:"";
    position:absolute;
    bottom:-110px; left:-90px;
    width:230px; height:230px;
    border:1px solid rgba(255,255,255,.07);
    border-radius:50%;
    pointer-events:none;
  }
  .card-link{
    position:relative;
    z-index:1;
    display:block;
    border-radius:10px;
    -webkit-tap-highlight-color:transparent;
  }
  .card-photo{
    display:block;
    width:100%;
    height:auto;
    border-radius:10px;
    background:#fff;
    box-shadow:0 14px 30px rgba(0,10,30,.42), 0 0 0 1px rgba(255,255,255,.18);
  }

  /* 명함 아래로 이어지는 골드 버튼 */
  .hero-cta{
    position:relative;
    z-index:2;
    margin:-6px 12px 0;
  }

  /* ───────── 버튼 공통 ───────── */
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    width:100%;
    border:0;
    border-radius:13px;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    letter-spacing:-0.01em;
    text-decoration:none;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background-color .12s ease;
    -webkit-appearance:none;
  }
  .btn:active{transform:scale(.985)}
  .btn svg{flex:none}

  .btn-gold{
    height:54px;
    color:#fff;
    background:linear-gradient(180deg,var(--gold-light) 0%, var(--gold) 52%, #B0964F 100%);
    box-shadow:0 10px 24px -8px rgba(160,135,72,.75), inset 0 1px 0 rgba(255,255,255,.28);
    text-shadow:0 1px 1px rgba(120,98,44,.35);
  }
  .btn-gold:hover{background:linear-gradient(180deg,#D1BC86 0%,#C0A662 52%,#B59B54 100%)}

  .btn-ghost{
    height:43px;
    color:var(--navy);
    background:#fff;
    border:1px solid var(--line);
    font-size:14px;
    font-weight:600;
    box-shadow:0 1px 2px rgba(20,35,60,.04);
  }
  .btn-ghost:hover{background:#FBFCFE}
  .btn-ghost svg{stroke:var(--navy)}

  .sub-actions{
    display:flex;
    gap:9px;
    margin:12px 12px 0;
  }
  .sub-actions .btn-ghost{flex:1;font-size:13.5px}

  .tel-line{
    margin-top:14px;
    text-align:center;
    font-size:18px;
    font-weight:700;
    letter-spacing:.05em;
    color:var(--navy);
  }
  .location-box{
    margin:14px 12px 0;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 13px;
    box-shadow:0 1px 2px rgba(20,35,60,.04);
  }
  .location-head{
    display:flex;
    align-items:flex-start;
    gap:9px;
    margin-bottom:10px;
  }
  .location-head svg{
    flex:none;
    margin-top:2px;
    stroke:var(--hyundai);
  }
  .location-name{
    font-size:13.5px;
    font-weight:700;
    color:var(--navy);
    line-height:1.35;
  }
  .location-addr{
    font-size:12.5px;
    color:var(--text-sub);
    margin-top:2px;
  }
  .btn-map{
    height:40px;
    color:#03A94D;
    background:#F4FBF6;
    border:1px solid #CFEAD8;
    font-size:13.5px;
    font-weight:700;
  }
  .btn-map:hover{background:#EAF8EE}
  .btn-map svg{stroke:#03A94D}

  /* ───────── 섹션 ───────── */
  .section{margin-top:30px}
  .section-title{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:16.5px;
    font-weight:800;
    letter-spacing:-0.02em;
    color:var(--navy);
    margin-bottom:13px;
  }
  .section-title::before{
    content:"";
    width:3.5px;
    height:16px;
    border-radius:2px;
    background:linear-gradient(180deg,var(--gold-light),var(--gold));
  }

  /* 약속 */
  .promise{
    background:
      radial-gradient(110% 80% at 100% 0%, #24395C 0%, rgba(36,57,92,0) 60%),
      linear-gradient(180deg,#172840 0%, #14233C 100%);
    border-radius:16px;
    padding:20px 18px;
    box-shadow:0 12px 26px -16px rgba(20,35,60,.55);
  }
  .promise li{
    display:flex;
    gap:10px;
    align-items:flex-start;
    color:#fff;
    font-size:13.5px;
    font-weight:700;
    line-height:1.5;
    letter-spacing:-0.02em;
    word-break:keep-all;
  }
  .promise li + li{margin-top:12px}
  .promise li svg{flex:none;margin-top:2px;stroke:#E8DDBE}

  /* 하단 CTA */
  .cta-card{
    background:#fff;
    border:1px solid var(--line-soft);
    border-radius:16px;
    padding:24px 18px 20px;
    text-align:center;
    box-shadow:0 1px 2px rgba(20,35,60,.035);
  }
  .cta-card .head{
    font-size:15px;
    font-weight:700;
    color:var(--navy);
    letter-spacing:-0.02em;
  }
  .cta-card .sub{
    margin-top:3px;
    font-size:14px;
    font-weight:500;
    color:var(--text-sub);
    letter-spacing:-0.02em;
    margin-bottom:17px;
  }
  .cta-card .btn-gold{height:52px;font-size:15px}
  .cta-card .btn-ghost{margin-top:9px}

  footer{
    margin-top:26px;
    text-align:center;
    color:var(--text-mute);
    font-size:11px;
    line-height:1.7;
  }
  footer .who{color:#9AA3AF}

  /* 토스트 */
  .toast{
    position:fixed;
    left:50%;
    bottom:34px;
    transform:translate(-50%, 14px);
    background:rgba(15,26,44,.94);
    color:#fff;
    font-size:13px;
    font-weight:500;
    padding:11px 18px;
    border-radius:999px;
    box-shadow:0 8px 22px rgba(10,20,35,.3);
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:99;
    max-width:88vw;
    text-align:center;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (min-width:560px){
    .wrap{padding-top:34px}
    .hero{padding:18px 18px 24px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- 상단 명함 -->
  <section class="hero">

      <img class="card-photo" src="./card.jpg" width="1200" height="653"
           alt="김정석 Car Master 명함 — 현대자동차 화명대리점, 010-8556-3857" />

  </section>

  <div class="hero-cta">
    <a class="btn btn-gold" href="tel:010-8556-3857" aria-label="010-8556-3857로 전화 상담하기">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6.6 3.5h3l1.5 3.6-2.1 1.4a11.3 11.3 0 0 0 5.5 5.5l1.4-2.1 3.6 1.5v3a2.3 2.3 0 0 1-2.5 2.3A16.7 16.7 0 0 1 4.3 6a2.3 2.3 0 0 1 2.3-2.5Z"/>

    <div class="location-head">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        <circle cx="12" cy="10" r="2.3"/>
      </svg>
      <div>

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

  <!-- 약속 -->

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var PHONE = "010-8556-3857";
  var toastEl = document.getElementById("toast");
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "0";
    ta.style.left = "-9999px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; })
        .catch(function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }

  document.getElementById("copyBtn").addEventListener("click", function () {
    copy(PHONE).then(function (ok) {
      toast(ok ? "번호가 복사되었습니다" : "복사가 안 되면 길게 눌러 복사해 주세요");
    });
  });

  document.getElementById("shareBtn").addEventListener("click", function () {
    var url = "https://naver.me/5Nenh49L";
    var shareData = {
      title: "김정석 Car Master | 현대자동차 화명대리점",
      text: "김정석 Car Master | 현대자동차 화명대리점",
      url: url
    };
    if (navigator.share) {
      navigator.share(shareData).catch(function (err) {
        if (err && err.name === "AbortError") return;
        copy(url).then(function (ok) {
          toast(ok ? "페이지 주소가 복사되었습니다" : "주소를 복사하지 못했습니다");
        });
      });
      return;
    }
    copy(url).then(function (ok) {
      toast(ok ? "페이지 주소가 복사되었습니다" : "주소를 복사하지 못했습니다");
    });
  });
})();
</script>
